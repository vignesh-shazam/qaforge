<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#080818"/>
    </linearGradient>
    <linearGradient id="glowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="iconG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="cyanG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="qaG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="forgeG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="320" height="80" rx="16" fill="url(#heroBg)"/>
  <rect width="320" height="80" rx="16" fill="url(#glowBg)"/>
  <rect width="320" height="80" rx="16" stroke="#6366f1" stroke-width="0.75" stroke-opacity="0.22" fill="none"/>
  <!-- Top edge highlight -->
  <path d="M16 0.75 Q160 0.75 304 0.75" stroke="white" stroke-width="0.5" stroke-opacity="0.05"/>

  <!-- Icon mark -->
  <g transform="translate(16, 13)">
    <!-- Hex precision frame -->
    <path d="M26 2 L46 13.5 L46 36.5 L26 48 L6 36.5 L6 13.5 Z"
          stroke="url(#iconG)" stroke-width="1.1" stroke-opacity="0.25" fill="none"/>
    <circle cx="26" cy="2"    r="1.4" fill="#818cf8" fill-opacity="0.38"/>
    <circle cx="46" cy="13.5" r="1.4" fill="#818cf8" fill-opacity="0.38"/>
    <circle cx="46" cy="36.5" r="1.4" fill="#818cf8" fill-opacity="0.38"/>
    <circle cx="26" cy="48"   r="1.4" fill="#818cf8" fill-opacity="0.38"/>
    <circle cx="6"  cy="36.5" r="1.4" fill="#818cf8" fill-opacity="0.38"/>
    <circle cx="6"  cy="13.5" r="1.4" fill="#818cf8" fill-opacity="0.38"/>
    <!-- Q ring -->
    <circle cx="26" cy="25" r="14"
            stroke="url(#iconG)" stroke-width="2.8"
            fill="#6366f1" fill-opacity="0.07"
            filter="url(#iconGlow)"/>
    <!-- Verification mark -->
    <path d="M19 25 L24 30.5 L33 18"
          stroke="url(#cyanG)" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"
          filter="url(#softGlow)"/>
    <!-- Q tail -->
    <path d="M36 35.5 L42.5 42"
          stroke="url(#cyanG)" stroke-width="3"
          stroke-linecap="round" filter="url(#softGlow)"/>
    <circle cx="42.5" cy="42" r="2.2" fill="#22d3ee" fill-opacity="0.85"/>
    <!-- Circuit accents -->
    <circle cx="26" cy="11" r="1.3" fill="#22d3ee" fill-opacity="0.5"/>
    <line x1="26" y1="11" x2="26" y2="13.5" stroke="#22d3ee" stroke-width="0.9" stroke-opacity="0.3"/>
    <line x1="38.5" y1="17" x2="41.5" y2="15" stroke="#818cf8" stroke-width="0.7" stroke-opacity="0.22"/>
    <circle cx="41.5" cy="15" r="0.9" fill="#818cf8" fill-opacity="0.3"/>
  </g>

  <!-- Separator -->
  <line x1="82" y1="16" x2="82" y2="64" stroke="#6366f1" stroke-width="0.75" stroke-opacity="0.22"/>

  <!-- Wordmark -->
  <text x="93" y="49"
        font-family="'Inter','SF Pro Display','Helvetica Neue','Segoe UI',Arial,sans-serif"
        font-weight="800" font-size="30" letter-spacing="-1"
        fill="url(#qaG)">QA</text>
  <text x="143" y="49"
        font-family="'Inter','SF Pro Display','Helvetica Neue','Segoe UI',Arial,sans-serif"
        font-weight="600" font-size="30" letter-spacing="-0.8"
        fill="url(#forgeG)">Forge</text>

  <!-- Tagline -->
  <text x="93" y="62"
        font-family="'Inter','SF Pro Display','Helvetica Neue','Segoe UI',Arial,sans-serif"
        font-weight="500" font-size="7.5" letter-spacing="3.2"
        fill="#818cf8" fill-opacity="0.52">AI QUALITY ENGINEERING</text>

  <!-- Beta badge -->
  <rect x="272" y="33" width="34" height="14" rx="6"
        fill="#6366f1" fill-opacity="0.14"
        stroke="#6366f1" stroke-width="0.6" stroke-opacity="0.3"/>
  <text x="277" y="43"
        font-family="'Inter',sans-serif"
        font-weight="700" font-size="7" letter-spacing="0.5"
        fill="#818cf8" fill-opacity="0.75">BETA</text>
</svg>
