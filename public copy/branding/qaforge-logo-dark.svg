<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="gBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="gGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="iconG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="cyanG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="qaG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="forgeG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="280" height="64" rx="12" fill="url(#gBg)"/>
  <rect width="280" height="64" rx="12" fill="url(#gGlow)"/>
  <rect width="280" height="64" rx="12" stroke="#6366f1" stroke-width="0.75" stroke-opacity="0.2" fill="none"/>

  <!-- Icon mark -->
  <g transform="translate(12, 10)">
    <path d="M22 2 L38 11 L38 31 L22 40 L6 31 L6 11 Z"
          stroke="url(#iconG)" stroke-width="1" stroke-opacity="0.28" fill="none"/>
    <circle cx="22" cy="2"  r="1.2" fill="#818cf8" fill-opacity="0.4"/>
    <circle cx="38" cy="11" r="1.2" fill="#818cf8" fill-opacity="0.4"/>
    <circle cx="38" cy="31" r="1.2" fill="#818cf8" fill-opacity="0.4"/>
    <circle cx="22" cy="40" r="1.2" fill="#818cf8" fill-opacity="0.4"/>
    <circle cx="6"  cy="31" r="1.2" fill="#818cf8" fill-opacity="0.4"/>
    <circle cx="6"  cy="11" r="1.2" fill="#818cf8" fill-opacity="0.4"/>
    <!-- Q ring -->
    <circle cx="22" cy="21" r="12"
            stroke="url(#iconG)" stroke-width="2.2"
            fill="#6366f1" fill-opacity="0.07"
            filter="url(#glow)"/>
    <!-- Verification mark -->
    <path d="M15.5 21 L20 26 L28.5 14.5"
          stroke="url(#cyanG)" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"
          filter="url(#glow)"/>
    <!-- Q tail -->
    <path d="M30.5 29.5 L35.5 34.5"
          stroke="url(#cyanG)" stroke-width="2.5"
          stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="35.5" cy="34.5" r="1.7" fill="#22d3ee" fill-opacity="0.8"/>
    <!-- Circuit accents -->
    <circle cx="22" cy="9" r="1.1" fill="#22d3ee" fill-opacity="0.5"/>
    <line x1="22" y1="9" x2="22" y2="11" stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.3"/>
    <line x1="33" y1="15" x2="36" y2="13" stroke="#818cf8" stroke-width="0.6" stroke-opacity="0.25"/>
    <circle cx="36" cy="13" r="0.9" fill="#818cf8" fill-opacity="0.3"/>
  </g>

  <!-- Separator -->
  <line x1="70" y1="14" x2="70" y2="50" stroke="#6366f1" stroke-width="0.75" stroke-opacity="0.22"/>

  <!-- Wordmark -->
  <text x="80" y="40"
        font-family="'Inter','SF Pro Display','Helvetica Neue','Segoe UI',Arial,sans-serif"
        font-weight="800" font-size="26" letter-spacing="-0.8"
        fill="url(#qaG)">QA</text>
  <text x="127" y="40"
        font-family="'Inter','SF Pro Display','Helvetica Neue','Segoe UI',Arial,sans-serif"
        font-weight="600" font-size="26" letter-spacing="-0.6"
        fill="url(#forgeG)">Forge</text>

  <!-- Tagline -->
  <text x="80" y="52"
        font-family="'Inter','SF Pro Display','Helvetica Neue','Segoe UI',Arial,sans-serif"
        font-weight="500" font-size="7.5" letter-spacing="3"
        fill="#818cf8" fill-opacity="0.55">AI QUALITY ENGINEERING</text>
</svg>
