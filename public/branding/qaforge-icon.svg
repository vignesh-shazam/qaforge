<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="gBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#gBg)"/>
  <rect width="64" height="64" rx="14" fill="#6366f1" fill-opacity="0.06"/>
  <rect width="64" height="64" rx="14" stroke="#6366f1" stroke-width="0.75" stroke-opacity="0.2" fill="none"/>

  <!-- Hexagon precision frame -->
  <path d="M32 8 L52 19.5 L52 44.5 L32 56 L12 44.5 L12 19.5 Z"
        stroke="url(#g1)" stroke-width="1.2" stroke-opacity="0.3" fill="none"/>
  <!-- Hex nodes -->
  <circle cx="32" cy="8"    r="1.5" fill="#818cf8" fill-opacity="0.45"/>
  <circle cx="52" cy="19.5" r="1.5" fill="#818cf8" fill-opacity="0.45"/>
  <circle cx="52" cy="44.5" r="1.5" fill="#818cf8" fill-opacity="0.45"/>
  <circle cx="32" cy="56"   r="1.5" fill="#818cf8" fill-opacity="0.45"/>
  <circle cx="12" cy="44.5" r="1.5" fill="#818cf8" fill-opacity="0.45"/>
  <circle cx="12" cy="19.5" r="1.5" fill="#818cf8" fill-opacity="0.45"/>

  <!-- Q main ring -->
  <circle cx="30" cy="30" r="13"
          stroke="url(#g1)" stroke-width="2.5"
          fill="#6366f1" fill-opacity="0.07"
          filter="url(#glow)"/>

  <!-- Angular verification mark -->
  <path d="M23 30 L28 35.5 L37 24"
        stroke="url(#g2)" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Q tail -->
  <path d="M39 39 L44.5 44.5"
        stroke="url(#g2)" stroke-width="3"
        stroke-linecap="round"
        filter="url(#glow)"/>
  <circle cx="44.5" cy="44.5" r="2" fill="#22d3ee" fill-opacity="0.85"/>

  <!-- Circuit top accent -->
  <circle cx="30" cy="17" r="1.2" fill="#22d3ee" fill-opacity="0.55"/>
  <line x1="30" y1="17" x2="30" y2="19.5" stroke="#22d3ee" stroke-width="0.9" stroke-opacity="0.35"/>
  <!-- Branch accent -->
  <line x1="40" y1="21" x2="43" y2="19" stroke="#818cf8" stroke-width="0.7" stroke-opacity="0.25"/>
  <circle cx="43" cy="19" r="1" fill="#818cf8" fill-opacity="0.35"/>
</svg>
